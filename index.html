<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CINEMAFIA</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;

      display:grid;
      place-items:center;

      background:#08090b;
      color:white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      padding:24px;
    }

    .access{
      width:100%;
      max-width:420px;

      text-align:center;
    }

    .eyebrow{
      color:#ff4d5f;

      font-size:.7rem;
      font-weight:900;

      letter-spacing:.18em;

      margin-bottom:12px;
    }

    h1{
      margin:0 0 8px;

      font-size:3rem;
      letter-spacing:.03em;
    }

    .subtitle{
      color:#888;

      font-size:.8rem;
      font-weight:bold;

      letter-spacing:.1em;

      margin-bottom:38px;
    }

    .password{
      width:100%;

      padding:17px;

      border-radius:12px;

      border:
        1px solid
        rgba(255,255,255,.18);

      background:#111318;

      color:white;

      font-size:1rem;

      text-align:center;

      outline:none;

      margin-bottom:12px;
    }

    .password:focus{
      border-color:#ff4d5f;
    }

    .enter{
      width:100%;

      padding:17px;

      border:0;

      border-radius:12px;

      background:#f6c945;

      color:#111;

      font-size:.95rem;
      font-weight:900;

      cursor:pointer;
    }

    .warning{
      margin-top:28px;

      color:#555;

      font-size:.65rem;

      letter-spacing:.08em;
    }

  </style>
</head>


<body>

  <main class="access">

    <div class="eyebrow">
      ACCESO RESTRINGIDO
    </div>

    <h1>
      CINEMAFIA
    </h1>

    <div class="subtitle">
      IDENTIFÍQUESE, SOSPECHOSO
    </div>


    <form id="loginForm">

      <input
        id="password"
        class="password"
        type="text"
        placeholder="CONTRASEÑA"
        autocomplete="off"
        required
      >

      <button
        class="enter"
        type="submit"
      >
        ENTRAR
      </button>

    </form>


    <div class="warning">
      EL ACCESO SERÁ REGISTRADO<br>
      O NO
    </div>

  </main>


  <script>

    const CINEMAFIA_URL =
      'https://script.google.com/macros/s/AKfycbyroIjcfMdB8WWm70yzLgi353Nz7DsWgezUlxdgmH9M8r9gRkJhOTgg_LiGMJrChIP8-g/exec';


    document
      .getElementById('loginForm')
      .addEventListener('submit', function(event){

        event.preventDefault();

        const password =
          document
            .getElementById('password')
            .value
            .trim();


        // Cualquier contraseña funciona.
        // La mafia no es especialmente competente.

        if(password){

          window.location.href =
            CINEMAFIA_URL;

        }

      });

  </script>

</body>
</html>
