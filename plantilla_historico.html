<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemafia Histórico</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 50px 0 30px;
      font-size: 2rem;
    }

    .lista {
      padding: 20px;
    }

    .fila-historico {
      display: grid;
      grid-template-columns: 420px 300px;
      gap: 20px;
      justify-content: center;
      align-items: center;
      margin: 10px auto;
    }

    .item {
      padding: 15px;
      background: #111;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      display: block;
      font-weight: bold;
    }

    .item:hover {
      background: #222;
    }

    .comentario-historico {
      padding: 14px 18px;
      background: #111;
      border: 1px solid rgba(255,212,71,.35);
      border-radius: 12px;
      color: #ffd447;
      font-weight: bold;
      text-align: left;
      min-height: 20px;
    }

    @media (max-width: 800px) {
      .fila-historico {
        grid-template-columns: 1fr;
        max-width: 420px;
      }

      .comentario-historico {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <h1>HISTÓRICO CINEMAFIA</h1>

  <div class="lista">
    {{LISTA}}
  </div>

</body>
</html>
